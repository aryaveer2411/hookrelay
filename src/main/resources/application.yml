spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${ENV_DB_URL}
    username: ${ENV_DB_USER}
    password: ${ENV_DB_PASSWORD}

  rabbitmq:
    addresses: ${ENV_RABBIT_URL}
    publisher-confirm-type: correlated
    publisher-returns: true

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${ENV_PORT:8080}

logging:
  level:
    com.hookrelay: ${ENV_LOG_LEVEL:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n"

hookrelay:
  secret-key: ${ENV_MASTER_KEY}
  logging:
    # Request/response bodies in the console. Secret-looking JSON fields are masked,
    # but turn this off in production if payloads may carry customer data.
    include-body: ${ENV_LOG_BODY:true}
    max-body-chars: 2000