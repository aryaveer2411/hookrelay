# Settings every app needs, pointing at the other containers by name
x-app-env: &app-env
  ENV_DB_URL: postgres://${ENV_DB_USER}:${ENV_DB_PASSWORD}@postgres:5432/${ENV_DB_NAME}
  ENV_RABBIT_URL: amqp://${ENV_RABBIT_USER}:${ENV_RABBIT_PASSWORD}@rabbitmq:5672
  ENV_REDIS_URL: redis://redis:6379
  ENV_HOST: 0.0.0.0

x-app: &app
  build: { context: ., target: app }
  image: hookrelay-app
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

x-worker-env: &worker-env
  <<: *app-env
  ENV_WORKER_PREFETCH: ${ENV_WORKER_PREFETCH:-20}
  ENV_SSRF_ALLOW_IPS: ""
  ENV_SSRF_ALLOW_HOSTS: mock-target
  ENV_ALLOW_HTTP: "true"

x-gateway-env: &gateway-env
  <<: *app-env
  ENV_GATEWAY_PORT: "8080"
  ENV_TRUST_PROXY: "true"
  ENV_ALLOWED_ORIGINS: ${ENV_PUBLIC_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ENV_DB_USER}
      POSTGRES_PASSWORD: ${ENV_DB_PASSWORD}
      POSTGRES_DB: ${ENV_DB_NAME}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # creates the tables on a brand-new database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENV_DB_USER} -d ${ENV_DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${ENV_RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${ENV_RABBIT_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./infra/rabbitmq.conf:/etc/rabbitmq/conf.d/20-hookrelay.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  ingest:
    <<: *app
    command: ["node", "--import", "tsx", "apps/ingest/src/server.ts"]
    environment:
      <<: *app-env
      ENV_TRUST_PROXY: "true"
    ports: ["127.0.0.1:3000:3000"]   # for local scripts; the public way in is nginx

  relay:
    <<: *app
    command: ["node", "--import", "tsx", "apps/relay/src/relay.ts"]
    environment: *app-env

  worker-a:
    <<: *app
    command: ["node", "--import", "tsx", "apps/worker/src/worker.ts"]
    environment:
      <<: *worker-env
      ENV_WORKER_NAME: worker-a
      ENV_WORKER_PRIMARY: p0,p1,p2,p3

  worker-b:
    <<: *app
    command: ["node", "--import", "tsx", "apps/worker/src/worker.ts"]
    environment:
      <<: *worker-env
      ENV_WORKER_NAME: worker-b
      ENV_WORKER_PRIMARY: p4,p5,p6,p7

  gateway1:
    <<: *app
    command: ["node", "--import", "tsx", "apps/gateway/src/gateway.ts"]
    environment:
      <<: *gateway-env
      ENV_GATEWAY_NAME: gw1

  gateway2:
    <<: *app
    command: ["node", "--import", "tsx", "apps/gateway/src/gateway.ts"]
    environment:
      <<: *gateway-env
      ENV_GATEWAY_NAME: gw2

  mock-target:
    <<: *app
    command: ["node", "--import", "tsx", "apps/mock-target/src/server.ts"]
    environment:
      <<: *app-env
      ENV_MOCK_LATENCY_MS: ${ENV_MOCK_LATENCY_MS:-50}
      ENV_MOCK_RECORD: ${ENV_MOCK_RECORD:-true}
    ports: ["127.0.0.1:4000:4000"]   # so scripts can call /_mode

  web:
    build: { context: ., target: web }
    image: hookrelay-web
    restart: unless-stopped
    depends_on: [ingest, gateway1, gateway2]
    ports: ["127.0.0.1:8080:80"]

  # Load testing tool, only started when you ask for it (--profile bench)
  k6:
    image: grafana/k6:latest
    profiles: ["bench"]
    working_dir: /scripts
    volumes: ["./bench:/scripts"]

volumes:
  pgdata:
  rabbitdata:
