upstream gateways {
  server gateway1:8080 max_fails=1 fail_timeout=5s;
  server gateway2:8080 max_fails=1 fail_timeout=5s;
}
upstream ingest {
  server ingest:3000;
  keepalive 64;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 1m;

  # Real visitor IP when another proxy (Caddy, in production) sits in front
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # WebSockets → either gateway
  location /ws {
    proxy_pass http://gateways;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;   # longer than the 25s ping
    proxy_send_timeout 75s;
  }

  # Webhooks in, and the admin API → ingest
  location /in/ {
    proxy_pass http://ingest;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/ {
    proxy_pass http://ingest;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Everything else → the dashboard (single-page app)
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
